# Docker's DNS returns every api replica; nginx re-resolves every 10s and spreads
# requests to the least busy one, retrying another replica if one fails.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_pool {
    least_conn;
    zone api_pool 64k;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    gzip on;
    gzip_types application/json;

    location /api/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_read_timeout 30s;
    }
}
