# Render Blueprint — free plan, one web service.
# Render allows only ONE free Key Value per workspace, so this reuses the one you already have:
# when the Blueprint asks for REDIS_URL, paste that Key Value's *Internal* URL with /1 at the end
# (database 1), so this app's keys stay separate from your other project's (database 0).
services:
  - type: web
    name: decoded-api
    runtime: python
    region: singapore   # same region as the Key Value (jobpilot-redis), and close to India
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process: the API + SSE streams + the embedded queue worker (decoding + RSS ingester).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: EMBEDDED_WORKER
        value: "1"
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: CLIENT_RPM
        value: "120"
      - key: NEWS_REGION
        value: IN
      - key: FEED_TTL_SECONDS
        value: "900"
      - key: GROQ_API_KEYS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEBUG_TOKEN          # unlocks /api/debug?token=…; Render makes a random one
        generateValue: true

