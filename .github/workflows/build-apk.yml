# Builds the Android APK on GitHub's servers (no Android Studio needed on your laptop).
# Set a repository variable API_BASE (Settings > Secrets and variables > Actions > Variables)
# to your server address, e.g. https://news.example.com — or set it later inside the app.
name: Build APK
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME), so no setup step is needed
      - run: echo "Android SDK at $ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - run: npm ci
      - run: npm run build
        env: { VITE_API_BASE: "${{ vars.API_BASE }}" }
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: app/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk news-decoded.apk
      - uses: actions/upload-artifact@v4
        with: { name: news-decoded-apk, path: app/news-decoded.apk }
      - name: Publish as "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: News Decoded (latest build)
          files: app/news-decoded.apk
          make_latest: true
    permissions: { contents: write }
